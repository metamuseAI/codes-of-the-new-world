kind = "web"
previewPath = "/"
title = "Codes of the New World"
version = "1.0.0"
id = "artifacts/book-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21525

[services.development]
run = "pnpm --filter @workspace/book-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/book-landing", "run", "build" ]
publicDir = "artifacts/book-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21525"
BASE_PATH = "/"
